[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalife-clinical-agents"
version = "0.1.0"
description = "Safety-bounded structured clinical intake research for DataLife e-Health."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["datalife_clinical_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
